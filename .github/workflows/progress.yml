name: Update Progress

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progress:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject aggregate files in pull requests
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- progress/report.json progress/code.svg progress/functions.svg; then
            echo "Do not commit generated progress files in a pull request."
            echo "Commit only the source and progress/matches proof; main updates the badges."
            exit 1
          fi

      - name: Calculate merged progress
        run: python3 tools/progress.py --summary

      - name: Update badges on the default branch
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        run: |
          python3 tools/progress.py
          python3 tools/progress.py --check

          if test -z "$(git status --porcelain -- progress/report.json progress/code.svg progress/functions.svg)"; then
            echo "Progress is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress/report.json progress/code.svg progress/functions.svg
          git commit -m "chore: update progress badges"
          git push
